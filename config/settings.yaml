camera:
  device_id: 0
  width: 1280
  height: 720
  fps_target: 30
  # Windows: use "dshow" (DirectShow) for faster init and better compatibility.
  # Other options: "msmf" (Media Foundation), "" (auto-detect).
  backend: dshow

mediapipe:
  max_num_hands: 2
  min_detection_confidence: 0.75
  min_tracking_confidence: 0.65
  static_image_mode: false

gui:
  theme: dark
  window_width: 1280
  window_height: 800

logging:
  level: INFO
